{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto p-4 space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold">📊 Oyma-oy taqqoslash</h1>
  </div>

  <form method="get" class="grid md:grid-cols-4 gap-3 bg-white border rounded-2xl p-4">
    {% if stores %}
    <div>
      <label class="text-xs text-neutral-500">Do‘kon</label>
      <select name="store_id" class="w-full rounded-xl border p-2">
        <option value="">Hammasi</option>
        {% for s in stores %}
          <option value="{{ s.id }}" {% if store_id|stringformat:"s" == s.id|stringformat:"s" %}selected{% endif %}>{{ s.name }}</option>
        {% endfor %}
      </select>
    </div>
    {% endif %}
    <div>
      <label class="text-xs text-neutral-500">Oylar</label>
      <input type="number" name="months" min="1" max="24" value="{{ months|default:12 }}" class="w-full rounded-xl border p-2">
    </div>
    <div class="md:col-span-4 flex justify-end">
      <button class="px-4 py-2 rounded-xl bg-black text-white">Ko‘rsat</button>
    </div>
  </form>

  <div class="rounded-2xl border overflow-x-auto bg-white">
    <table class="min-w-full text-sm">
      <thead class="bg-neutral-50 text-neutral-600">
        <tr>
          <th class="text-left px-4 py-2">Oy</th>
          <th class="text-right px-4 py-2">Kassa</th>
          <th class="text-right px-4 py-2">Net profit</th>
        </tr>
      </thead>
      <tbody>
        {% for r in series %}
        <tr class="border-t">
          <td class="px-4 py-2">{{ r.year }}-{{ r.month|stringformat:"02d" }}</td>
          <td class="px-4 py-2 text-right">{{ r.kassa }}</td>
          <td class="px-4 py-2 text-right">{{ r.net_profit }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="px-4 py-6 text-center text-neutral-500">Ma’lumot yo‘q</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
