# sales/sell_installment.html
{% extends "base.html" %}
{% block title %}Bo‘lib to‘lash · PhoneStore{% endblock %}
{% block content %}
<div class="card p-5 max-w-2xl">
  <h1 class="text-xl font-semibold mb-4">Bo‘lib to‘lash</h1>
  <div class="mb-4 rounded-xl border border-neutral-200 p-4 bg-neutral-50">
    <div class="text-sm text-neutral-600">Telefon</div>
    <div class="font-medium">{{ product.brand.name }} {{ product.model.name }} — IMEI: {{ product.imei_full }}</div>
  </div>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs text-neutral-500 mb-1">Mijoz ismi (majburiy)</label>
      <input type="text" name="customer_name" class="w-full rounded-xl border-neutral-300" required>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs text-neutral-500 mb-1">Telefon (ixtiyoriy)</label>
        <input type="text" name="customer_phone" class="w-full rounded-xl border-neutral-300">
      </div>
      <div>
        <label class="block text-xs text-neutral-500 mb-1">Izoh (ixtiyoriy)</label>
        <input type="text" name="note" class="w-full rounded-xl border-neutral-300">
      </div>
    </div>

    <div>
      <label class="block text-xs text-neutral-500 mb-1">Umumiy narx</label>
      <input type="text" name="total_price" class="w-full rounded-xl border-neutral-300" required>
    </div>

    <div>
      <label class="block text-xs text-neutral-500 mb-1">Hozir to‘lov turi</label>
      <select name="payment_type" id="ptype" class="w-full rounded-xl border-neutral-300">
        <option value="cash">Naqd</option>
        <option value="card">Karta</option>
        <option value="mixed">Aralash</option>
      </select>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs text-neutral-500 mb-1">Hozir naqd</label>
        <input type="text" name="upfront_cash" id="cash" class="w-full rounded-xl border-neutral-300" value="0">
      </div>
      <div>
        <label class="block text-xs text-neutral-500 mb-1">Hozir karta</label>
        <input type="text" name="upfront_card" id="card" class="w-full rounded-xl border-neutral-300" value="0">
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button class="btn btn-primary">Saqlash</button>
      <a class="btn btn-ghost" href="{% url 'sell' %}?product_id={{ product.id }}">Oddiy sotuvga qaytish</a>
    </div>
  </form>
</div>

<script>
  const ptype = document.getElementById('ptype'), cash = document.getElementById('cash'), card = document.getElementById('card');
  function sync() {
    if (ptype.value === 'cash') { card.value = '0'; card.readOnly = true; cash.readOnly = false; }
    else if (ptype.value === 'card') { cash.value = '0'; cash.readOnly = true; card.readOnly = false; }
    else { cash.readOnly = false; card.readOnly = false; }
  }
  ptype.addEventListener('change', sync); sync();
</script>
{% endblock %}
