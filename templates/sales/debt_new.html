{% extends "base.html" %}
{% load i18n %}
{% block header_title %}{% trans "New debt" %}{% endblock %}
{% block content %}
<div class="p-4">
  <form method="post" class="bg-white border rounded-xl p-4 space-y-3">
    {% csrf_token %}
    <div>
      <label class="block text-sm mb-1">{% trans "Debtor name" %}</label>
      {{ form.debtor_name }}
    </div>
    <div>
      <label class="block text-sm mb-1">{% trans "Amount" %}</label>
      {{ form.amount }}
    </div>
    <div>
      <label class="block text-sm mb-1">{% trans "Note" %}</label>
      {{ form.note }}
    </div>
    <button class="w-full bg-black text-white rounded-lg py-2">{% trans "Save" %}</button>
  </form>
</div>
{% endblock %}
