# sales/debt_new_simple.html
{% extends "base.html" %}
{% block title %}Yangi qarz · PhoneStore{% endblock %}
{% block content %}
<div class="card p-5 max-w-xl">
  <h1 class="text-xl font-semibold mb-4">Yangi qarz</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs text-neutral-500 mb-1">Summa</label>
      <input type="text" name="amount" class="w-full rounded-xl border-neutral-300" required>
    </div>
    <div>
      <label class="block text-xs text-neutral-500 mb-1">Izoh (ixtiyoriy)</label>
      <input type="text" name="note" class="w-full rounded-xl border-neutral-300">
    </div>
    <button class="btn btn-primary">Saqlash</button>
  </form>
</div>
{% endblock %}
