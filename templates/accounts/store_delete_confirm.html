{% extends "base.html" %}{% load i18n %}
{% block header_title %}{% trans "Delete store" %}{% endblock %}
{% block content %}

    {% trans "Delete store" %}: <strong>{{ obj.name }}</strong>?
  </div>

</div>
{% endblock %}
