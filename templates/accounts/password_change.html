{# templates/accounts/password_change.html #}
{% extends "base.html" %}{% load i18n %}
{% block title %}{% trans "Change password" %} · PhoneStore{% endblock %}
{% block content %}
<div class="py-8 grid place-items-center">
  <form method="post" class="card p-6 w-full max-w-sm space-y-3">
    {% csrf_token %}
    <div>
      <label class="block text-sm mb-1">{% trans "Current password" %}</label>
      <input name="old_password" type="password" class="w-full border rounded-xl px-3 py-2" required>
    </div>
    <div>
      <label class="block text-sm mb-1">{% trans "New password" %}</label>
      <input name="new_password1" type="password" class="w-full border rounded-xl px-3 py-2" required>
    </div>
    <div>
      <label class="block text-sm mb-1">{% trans "Confirm new password" %}</label>
      <input name="new_password2" type="password" class="w-full border rounded-xl px-3 py-2" required>
    </div>
    <button class="btn btn-primary w-full">{% trans "Save" %}</button>
  </form>
</div>
{% endblock %}
