# accounts/store_form.html
{% extends "base.html" %}{% load i18n %}
{% block header_title %}{% trans "Store" %}{% endblock %}
{% block content %}
<div class="p-4">
  <form method="post" class="bg-white border rounded-xl p-4 space-y-3">
    {% csrf_token %}
    <div>
      <label class="text-sm">{% trans "Name" %}</label>
      {{ form.name }}
    </div>
    <div class="flex items-center gap-2">
      {{ form.is_active }} <span class="text-sm">{% trans "Active" %}</span>
    </div>
    <button class="w-full bg-black text-white rounded-lg py-2">{% trans "Save" %}</button>
  </form>
</div>
{% endblock %}
