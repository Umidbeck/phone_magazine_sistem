<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: DejaVu Sans, Arial, sans-serif; font-size: 12px; }
    table { width:100%; border-collapse: collapse; }
    th, td { border:1px solid #ccc; padding:6px; }
    th { background:#f5f5f5; }
  </style>
</head>
<body>
  <h3>Products</h3>
  <table>
    <thead>
      <tr>
        <th>Store</th><th>Brand</th><th>Model</th><th>Color</th><th>IMEI</th><th>Status</th><th>Created</th>
      </tr>
    </thead>
    <tbody>
      {% for p in products %}
      <tr>
        <td>{{ p.store.name }}</td>
        <td>{{ p.brand.name }}</td>
        <td>{{ p.model.name }}</td>
        <td>{{ p.color.name if p.color }}</td>
        <td>{{ p.imei_full }}</td>
        <td>{{ p.status }}</td>
        <td>{{ p.created_at|date:"Y-m-d H:i" }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
