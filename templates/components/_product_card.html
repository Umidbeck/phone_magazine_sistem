{% comment %} context: expects "p" Product instance {% endcomment %}
<a href="{% url 'product_detail' p.id %}" class="block overflow-hidden rounded-2xl border border-neutral-200 bg-white group">
  <div class="aspect-[4/5] bg-neutral-100 relative">
    {% with p.images.all as imgs %}
      {% if imgs and imgs.0.image %}
        <img src="{{ imgs.0.image.url }}" class="w-full h-full object-cover group-hover:scale-105 transition">
      {% else %}
        <div class="absolute inset-0 flex items-center justify-center text-xs text-neutral-400">
          {{ p.brand.name }} {{ p.model.name }}
        </div>
      {% endif %}
    {% endwith %}
    <div class="absolute bottom-0 left-0 right-0 bg-black/55 text-white text-[11px] p-1 flex justify-between">
      <span class="truncate">{{ p.brand.name }} {{ p.model.name }}</span>
      <span class="pl-2 truncate">{{ p.store.name }}</span>
    </div>
  </div>
</a>
