# 80 port - ACME challenge va 443ga redirect
server {
    listen 80;
    server_name ${VHOST_DOMAIN};

    # ACME challenge (certbot webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 HTTPS
server {
    listen 443 ssl http2;
    server_name ${VHOST_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${VHOST_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${VHOST_DOMAIN}/privkey.pem;

    # Security (minimal)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Static
    location /static/ {
        alias /app/static/;
        access_log off;
        expires 30d;
    }
    # Media
    location /media/ {
        alias /app/media/;
        expires 30d;
    }

    # Django (Gunicorn)
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90;
    }
}
