# docker-compose.dev.yml - Development Override
version: "3.9"

services:
  web:
    environment:
      - DEBUG=True
      - USE_POSTGRESQL=False
      - USE_REDIS=False
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000

  nginx:
    ports:
      - "8080:80"