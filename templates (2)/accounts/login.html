{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Sign in" %}{% endblock %}
{% block header_title %}{% trans "Sign in" %}{% endblock %}

{% block content %}
<div class="p-4">
  <div class="bg-white border rounded-xl p-4 mt-4">
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm mb-1">{% trans "Username" %}</label>
        <input name="username" required class="w-full border rounded-lg px-3 py-2" autofocus>
      </div>
      <div>
        <label class="block text-sm mb-1">{% trans "Password" %}</label>
        <input name="password" type="password" required class="w-full border rounded-lg px-3 py-2">
      </div>
      <button class="w-full bg-black text-white rounded-lg py-2">{% trans "Login" %}</button>
    </form>
  </div>
</div>
{% endblock %}
