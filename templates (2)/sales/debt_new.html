# sales/debt_new.html
{% extends "base.html" %}
{% block title %}To‘lov kiritish · PhoneStore{% endblock %}
{% block content %}
<div class="card p-5 max-w-xl">
  <h1 class="text-xl font-semibold mb-3">To‘lov kiritish</h1>
  <div class="rounded-xl border border-neutral-200 p-3 bg-neutral-50 mb-4">
    <div class="text-sm text-neutral-600">Qarzdor</div>
    <div class="font-medium">{{ debtor_label }}</div>
    <div class="text-sm text-neutral-600 mt-2">Qolgan</div>
    <div class="font-medium text-amber-700">{{ balance }}</div>
  </div>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs text-neutral-500 mb-1">Summa</label>
      <input type="number" step="0.01" name="amount" required class="w-full rounded-xl border-neutral-300">
    </div>
    <button class="btn btn-primary">Saqlash</button>
  </form>
</div>
{% endblock %}
